[project]
name = "rhinestone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "kitazawa", email = "88121050+U-KITAZAWA@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "rdflib>=6,<7",
    "pyright>=1.1.339,<1.1.390",
    "pytest>=7.4.4,<8",
    "pytest-cov>=4.1,<5",
    "ruff>=0.12.12,<0.13",
]

[tool.coverage.run]
source = ["rhinestone"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = [
    "--cov=rhinestone",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py37"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."
