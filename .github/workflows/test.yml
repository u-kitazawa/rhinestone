name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --dev --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - run: uv build
      - name: Install and import the wheel with pip
        shell: bash
        run: |
          wheel_venv="$RUNNER_TEMP/rhinestone-wheel"
          python -m venv "$wheel_venv"
          "$wheel_venv/bin/python" -m pip install --upgrade pip
          "$wheel_venv/bin/python" -m pip install dist/*.whl
          "$wheel_venv/bin/python" -c "from rhinestone import sources; assert sources.GSI.settings['items']['std']['metadata']['raw']['url'].endswith('/std/{z}/{x}/{y}.png')"
