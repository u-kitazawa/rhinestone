name: Dependency audit

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test audit completeness and error classification
        run: python scripts/test_audit_dependencies.py
      - name: Audit all locked runtime and development dependencies
        run: python scripts/audit_dependencies.py
